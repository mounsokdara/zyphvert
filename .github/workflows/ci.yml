name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Lint + unit tests run once (they do not depend on the CPU type).
  check:
    name: Lint and tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch FFmpeg AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-ffmpeg-aar.sh

      - name: Lint
        run: ./gradlew lint --no-daemon 2>&1 | tee -a /tmp/build.log

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee -a /tmp/build.log

      - name: Publish build log to ci-logs branch (on failure)
        if: failure()
        run: |
          mkdir /tmp/logs && cp /tmp/build.log /tmp/logs/ || true
          cp app/build/reports/lint-results-debug.xml /tmp/logs/ 2>/dev/null || true
          cd /tmp/logs && git init -q && git checkout -q -b ci-logs
          git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git add . && git commit -qm "build log for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # One job per CPU type, so each artifact zip holds exactly one APK.
  build:
    name: Debug APK · ${{ matrix.abi }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, universal]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch FFmpeg AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-ffmpeg-aar.sh

      - name: Assemble debug (${{ matrix.abi }})
        run: |
          # "universal" = no ABI restriction (all CPU types in one APK)
          if [ "${{ matrix.abi }}" = "universal" ]; then ABI_ARG=""; else ABI_ARG="-PtargetAbi=${{ matrix.abi }}"; fi
          set -o pipefail
          ./gradlew assembleDebug $ABI_ARG --no-daemon 2>&1 | tee -a /tmp/build.log

      - name: Collect the single APK
        run: |
          mkdir -p dist
          if [ "${{ matrix.abi }}" = "universal" ]; then
            cp app/build/outputs/apk/debug/*universal*.apk "dist/zyphvert-debug-universal.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/zyphvert-debug-${{ matrix.abi }}.apk"
          fi
          ls -lh dist/

      - name: Publish build log to ci-logs-${{ matrix.abi }} branch (on failure)
        if: failure()
        run: |
          mkdir /tmp/logs && cp /tmp/build.log /tmp/logs/ || true
          cd /tmp/logs && git init -q && git checkout -q -b ci-logs-${{ matrix.abi }}
          git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git add . && git commit -qm "build log (${{ matrix.abi }}) for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-${{ matrix.abi }}

      - name: Upload debug APK (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error
