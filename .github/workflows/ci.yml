name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:   # adds the "Run workflow" button on the Actions page

jobs:
  # Lint + unit tests run once (they do not depend on the CPU type).
  check:
    name: Lint and tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch FFmpeg AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-ffmpeg-aar.sh

      - name: Lint
        run: ./gradlew lintRelease --no-daemon 2>&1 | tee -a /tmp/build.log

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon 2>&1 | tee -a /tmp/build.log

      - name: Publish build log to ci-logs branch (on failure)
        if: failure()
        run: |
          mkdir /tmp/logs && cp /tmp/build.log /tmp/logs/ || true
          cp app/build/reports/lint-results-release.xml /tmp/logs/ 2>/dev/null || true
          cd /tmp/logs && git init -q && git checkout -q -b ci-logs
          git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git add . && git commit -qm "build log for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # One job per CPU type, so each artifact zip holds exactly one APK.
  build:
    name: APK · ${{ matrix.abi }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, universal]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Add Android build-tools (apksigner, zipalign) to PATH
        run: |
          # Preinstalled on GitHub's runners: no extra download that can fail.
          BT="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)"
          echo "Using $BT"
          test -x "$BT/apksigner" && test -x "$BT/zipalign"
          echo "$BT" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch FFmpeg AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-ffmpeg-aar.sh

      - name: Decode keystore and write key.properties
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"
          cat > key.properties <<PROPS
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/release.p12
          PROPS

      - name: Assemble release (${{ matrix.abi }})
        run: |
          # "universal" = no ABI restriction (all CPU types in one APK)
          if [ "${{ matrix.abi }}" = "universal" ]; then ABI_ARG=""; else ABI_ARG="-PtargetAbi=${{ matrix.abi }}"; fi
          set -o pipefail
          ./gradlew assembleRelease $ABI_ARG --no-daemon 2>&1 | tee -a /tmp/build.log

      - name: Sign with v1 + v2 + v3 and verify
        run: |
          mkdir -p dist
          if [ "${{ matrix.abi }}" = "universal" ]; then
            SRC="$(find app/build/outputs/apk/release -name '*universal*.apk' | head -1)"
          else
            SRC="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          fi
          [ -n "$SRC" ] || { echo "::error::no release APK was built"; exit 1; }
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Pull requests get no secrets, so there is no key: keep the APK unsigned and say so in its name.
            cp "$SRC" "dist/zyphvert-${{ matrix.abi }}-unsigned.apk"
          else
            chmod +x scripts/sign-apk.sh
            KS_FILE="$RUNNER_TEMP/release.p12" \
            KS_PASS="${{ secrets.KEYSTORE_PASSWORD }}" \
            KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            KEY_PASS="${{ secrets.KEY_PASSWORD }}" \
            scripts/sign-apk.sh "$SRC" "dist/zyphvert-${{ matrix.abi }}.apk"
          fi
          ls -lh dist/

      - name: Remove key.properties and keystore
        if: always()
        run: |
          rm -f key.properties
          shred -u "$RUNNER_TEMP/release.p12" 2>/dev/null || rm -f "$RUNNER_TEMP/release.p12"

      - name: Publish build log to ci-logs-${{ matrix.abi }} branch (on failure)
        if: failure()
        run: |
          mkdir /tmp/logs && cp /tmp/build.log /tmp/logs/ || true
          cd /tmp/logs && git init -q && git checkout -q -b ci-logs-${{ matrix.abi }}
          git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git add . && git commit -qm "build log (${{ matrix.abi }}) for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-${{ matrix.abi }}

      - name: Upload APK (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}
          path: dist/*.apk
          if-no-files-found: error
