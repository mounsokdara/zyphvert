name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK build-tools (for apksigner)
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch FFmpeg AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-ffmpeg-aar.sh

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Write key.properties (not committed — runtime only)
        run: |
          cat > key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/release.p12
          EOF

      - name: Build signed release APKs (per-ABI + universal) and AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Remove key.properties (secrets no longer needed on disk)
        if: always()
        run: rm -f key.properties

      - name: Verify every APK with apksigner (reused signer script)
        run: |
          chmod +x scripts/sign-apk.sh
          mkdir -p verified
          for apk in app/build/outputs/apk/release/*.apk; do
            name="$(basename "$apk")"
            echo "::group::Verifying $name"
            KS_FILE="$RUNNER_TEMP/release.p12" \
            KS_PASS="${{ secrets.KEYSTORE_PASSWORD }}" \
            KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            KEY_PASS="${{ secrets.KEY_PASSWORD }}" \
            scripts/sign-apk.sh "$apk" "verified/$name"
            echo "::endgroup::"
          done

      - name: Shred decoded keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/release.p12" 2>/dev/null || rm -f "$RUNNER_TEMP/release.p12"

      - name: Generate SHA256 checksums
        run: |
          mkdir -p dist
          cp verified/*.apk dist/
          cp app/build/outputs/bundle/release/*.aab dist/
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
