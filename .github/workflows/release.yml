name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:

  # ── One job per ABI, run in parallel ─────────────────────────────────────
  build-apk:
    name: APK · ${{ matrix.abi }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            task: assembleRelease
          - abi: armeabi-v7a
            task: assembleRelease
          - abi: x86_64
            task: assembleRelease

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch FFmpeg AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-ffmpeg-aar.sh

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Write key.properties
        run: |
          cat > key.properties <<PROPS
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/release.p12
          PROPS

      - name: Build ${{ matrix.abi }} APK
        # -PtargetAbi (see app/build.gradle.kts) packages only this CPU type, no ABI splits.
        run: >
          ./gradlew ${{ matrix.task }}
          -PtargetAbi=${{ matrix.abi }}
          --no-daemon

      - name: Name the APK by CPU type
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/app-${{ matrix.abi }}-release.apk"

      - name: Remove key.properties
        if: always()
        run: rm -f key.properties

      - name: Shred keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/release.p12" 2>/dev/null || rm -f "$RUNNER_TEMP/release.p12"

      - name: Upload ${{ matrix.abi }} APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}
          path: out/app-${{ matrix.abi }}-release.apk
          if-no-files-found: error

  # ── Universal APK + AAB (no ABI filter — includes all architectures) ──────
  build-universal:
    name: APK · universal + AAB
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK build-tools (for apksigner)
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch FFmpeg AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-ffmpeg-aar.sh

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Write key.properties
        run: |
          cat > key.properties <<PROPS
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/release.p12
          PROPS

      - name: Build universal APK + AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Remove key.properties
        if: always()
        run: rm -f key.properties

      - name: Shred keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/release.p12" 2>/dev/null || rm -f "$RUNNER_TEMP/release.p12"

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-universal
          path: app/build/outputs/apk/release/*universal*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  # ── Collect, verify signatures, checksum, publish ─────────────────────────
  publish:
    name: Verify & Publish
    needs: [build-apk, build-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK build-tools (for apksigner)
        uses: android-actions/setup-android@v3

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect into dist/
        run: |
          mkdir -p dist
          find artifacts -name "*.apk" -exec cp {} dist/ \;
          find artifacts -name "*.aab" -exec cp {} dist/ \;
          echo "── dist contents ──"
          ls -lh dist/

      - name: Verify every APK with apksigner
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"
          chmod +x scripts/sign-apk.sh
          mkdir -p verified
          for apk in dist/*.apk; do
            name="$(basename "$apk")"
            echo "::group::Verifying $name"
            KS_FILE="$RUNNER_TEMP/release.p12" \
            KS_PASS="${{ secrets.KEYSTORE_PASSWORD }}" \
            KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            KEY_PASS="${{ secrets.KEY_PASSWORD }}" \
            scripts/sign-apk.sh "$apk" "verified/$name"
            echo "::endgroup::"
          done
          shred -u "$RUNNER_TEMP/release.p12" 2>/dev/null || rm -f "$RUNNER_TEMP/release.p12"
          cp dist/*.aab verified/ 2>/dev/null || true

      - name: Generate SHA256 checksums
        run: |
          cd verified
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload combined release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: verified/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: verified/*
